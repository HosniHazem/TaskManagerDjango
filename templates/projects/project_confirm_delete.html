{% extends 'base.html' %}

{% block title %}Delete Project{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h4>Confirm Deletion</h4>
            </div>
            <div class="card-body">
                <p>Are you sure you want to delete the project "<strong>{{ project.name }}</strong>"?</p>
                <p class="text-warning"><i class="bi bi-exclamation-triangle"></i> This will also delete all associated tasks!</p>
                <p class="text-muted">This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Yes, Delete Everything</button>
                        <a href="{% url 'project_detail' project.slug %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
